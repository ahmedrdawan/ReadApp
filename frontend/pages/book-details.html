<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Readify - Book Details</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" data-nav></aside>
    <main class="content">
      <article class="book-details card">
        <img src="https://images.unsplash.com/photo-1495446815901-a7297e633e8d?auto=format&fit=crop&w=500&q=80" alt="Book cover" />
        <div>
          <p class="hero-tag">Book Details</p>
          <h2>Ikigai</h2>
          <p class="subtle-dark">By Héctor García and Francesc Miralles</p>
          <p>Ikigai explores the Japanese philosophy of finding meaning and joy in life through purpose, habits, and balance.</p>
          <div class="hero-actions">
            <button class="btn primary">Start Reading</button>
            <button class="btn secondary">Add to Library</button>
          </div>
        </div>
      </article>
    </main>
  </div>
  <script src="../script.js"></script>
</body>
</html>
