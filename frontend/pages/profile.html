<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Readify - Profile</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" data-nav></aside>
    <main class="content">
      <section class="profile-layout">
        <article class="card profile-main">
          <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=300&q=80" alt="Profile" />
          <h2>Maya Carter</h2>
          <p>Book lover. Fiction fan. Community reviewer.</p>
        </article>
        <article class="card profile-side">
          <h3>Reading Goals</h3>
          <ul>
            <li>52 books this year</li>
            <li>Read 20 minutes daily</li>
            <li>Write 2 reviews/month</li>
          </ul>
        </article>
      </section>
    </main>
  </div>
  <script src="../script.js"></script>
</body>
</html>
