<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Readify - My Library</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" data-nav></aside>
    <main class="content">
      <h2>My Library</h2>
      <section class="stats-grid">
        <article class="card stat"><h3>48</h3><p>Books read</p></article>
        <article class="card stat"><h3>12</h3><p>Currently reading</p></article>
        <article class="card stat"><h3>7</h3><p>Want to read</p></article>
      </section>
      <div id="bookGrid" class="book-grid"></div>
    </main>
  </div>
  <script src="../script.js"></script>
</body>
</html>
