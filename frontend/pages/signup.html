<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Readify - Sign Up</title>
  <link rel="stylesheet" href="../style.css" />
</head>
<body class="auth-body">
  <main class="auth-card card">
    <h1>Create account</h1>
    <p>Start tracking books and building your personal library.</p>
    <label>Full Name<input type="text" placeholder="Jane Reader" /></label>
    <label>Email<input type="email" placeholder="you@example.com" /></label>
    <label>Password<input type="password" placeholder="Create password" /></label>
    <button class="btn primary">Sign up</button>
    <a class="auth-link" href="./login.html">Already have an account? Login</a>
  </main>
</body>
</html>
